name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    # 只有这个 job 需要写：创建 Release 并上传产物。test job 保持默认只读。
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: oss-backup-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: oss-backup-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.archive }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/oss-backup.exe dist/
          else
            cp target/${{ matrix.target }}/release/oss-backup dist/
          fi
          cp README.md config.example.jsonc dist/
          cd dist && 7z a ../${{ matrix.archive }}.zip . 2>/dev/null || zip -r ../${{ matrix.archive }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}.zip
