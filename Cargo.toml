[package]
name = "oss-backup"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "oss-backup"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "local-time"] }
chrono = { version = "0.4", features = ["serde"] }
opendal = { version = "0.59", features = ["services-oss"] }
zstd = "0.13"
tar = "0.4"
age = "0.12"
sha2 = "0.10"
hex = "0.4"
globset = "0.4"
walkdir = "2"
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
